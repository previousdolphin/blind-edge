<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="B.E.Chat icon">
  <defs>
    <linearGradient id="bfold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#166534"/>
      <stop offset="45%"  stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="bglow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feFlood flood-color="#4ade80" flood-opacity="0.35" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="s"/>
      <feComposite in="SourceGraphic" in2="s" operator="over"/>
    </filter>
  </defs>

  <!-- Background: full-bleed dark square (rounded corners applied by the OS mask) -->
  <rect width="512" height="512" fill="#0a0a0a"/>
  <rect x="2" y="2" width="508" height="508" rx="96" stroke="#1e1e1e" stroke-width="4" fill="none"/>

  <!-- Blinded ninja, centered for the ~80% maskable safe zone -->
  <g transform="translate(33.5, 39.5) scale(2.5)">
    <!-- Shoulders / gi -->
    <path d="M 10 156 Q 32 127 76 123 Q 120 127 142 156" fill="#0d0d0d" stroke="#232323" stroke-width="1.5"/>
    <!-- Gi collar crossover -->
    <path d="M 58 128 L 76 147 L 94 128" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Neck -->
    <rect x="66" y="106" width="20" height="20" rx="5" fill="#0f0f0f" stroke="#232323" stroke-width="1.5"/>
    <!-- Hood -->
    <path d="M 76 19
             C 49 19 31 39 30 65
             C 29 92 44 113 76 115
             C 108 113 123 92 122 65
             C 121 39 103 19 76 19 Z"
          fill="#111" stroke="#1e1e1e" stroke-width="1.5"/>
    <!-- Single cloth fold above the band -->
    <path d="M 58 24 Q 50 36 47 50" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Face mask: lower face fully covered -->
    <path d="M 36 84 Q 76 96 116 84 L 113 100 Q 76 113 39 100 Z" fill="#0d0d0d" stroke="#1f1f1f" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Mask seam -->
    <path d="M 46 99 Q 76 108 106 99" stroke="#191919" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Blindfold band — over the eyes -->
    <rect x="26" y="54" width="100" height="27" rx="6.5" fill="url(#bfold)" filter="url(#bglow)"/>
    <rect x="33" y="58" width="56" height="9" rx="4.5" fill="#fff" opacity="0.14"/>
    <!-- Knot -->
    <ellipse cx="127" cy="67" rx="9.5" ry="8.5" fill="#166534"/>
    <ellipse cx="127" cy="67" rx="5.5" ry="5" fill="#15803d"/>
    <!-- Flowing tails — asymmetric, wind-blown -->
    <path d="M 133 62 C 143 60 152 55 156 46 C 159 54 152 63 139 67 Z" fill="url(#bfold)"/>
    <path d="M 133 72 C 142 74 150 81 154 89 C 158 97 162 101 168 104 C 161 103 155 99 151 93 C 146 85 140 79 133 78 Z" fill="#166534"/>
  </g>
</svg>
