<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="B.E.Chat icon">
  <defs>
    <linearGradient id="bfold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#166534"/>
      <stop offset="45%"  stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="bglow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feFlood flood-color="#4ade80" flood-opacity="0.35" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="s"/>
      <feComposite in="SourceGraphic" in2="s" operator="over"/>
    </filter>
  </defs>

  <!-- Background: full-bleed dark square (rounded corners applied by the OS mask) -->
  <rect width="512" height="512" fill="#0a0a0a"/>
  <rect x="2" y="2" width="508" height="508" rx="96" stroke="#1e1e1e" stroke-width="4" fill="none"/>

  <!-- Blindfolded figure, centered, sized for the ~80% maskable safe zone -->
  <g transform="translate(36, 32) scale(2.52)">
    <!-- Shoulders -->
    <path d="M 12 155 Q 38 134 76 130 Q 114 134 140 155" stroke="#222" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Neck -->
    <rect x="67" y="113" width="18" height="19" rx="5" fill="#111" stroke="#222" stroke-width="1.5"/>
    <!-- Ears -->
    <ellipse cx="33" cy="72" rx="7" ry="12" fill="#111" stroke="#1e1e1e" stroke-width="1.5"/>
    <ellipse cx="119" cy="72" rx="7" ry="12" fill="#111" stroke="#1e1e1e" stroke-width="1.5"/>
    <!-- Head -->
    <circle cx="76" cy="72" r="46" fill="#111" stroke="#1e1e1e" stroke-width="1.5"/>
    <!-- Blindfold -->
    <rect x="33" y="57" width="92" height="28" rx="7" fill="url(#bfold)" filter="url(#bglow)"/>
    <rect x="40" y="61" width="52" height="10" rx="5" fill="#fff" opacity="0.14"/>
    <!-- Knot + tie tails -->
    <ellipse cx="131" cy="71" rx="10" ry="9" fill="#166534"/>
    <ellipse cx="131" cy="71" rx="6" ry="5" fill="#15803d"/>
    <path d="M 139 64 C 147 58 155 52 162 47" stroke="#166534" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 139 78 C 147 84 155 90 162 95" stroke="#166534" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Nose + smile -->
    <path d="M 73 82 L 72 94 Q 76 98 80 94 L 79 82" stroke="#252525" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 60 108 Q 76 120 92 108" stroke="#252525" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
